name: CodeQL

on:
  push:
    branches: ["main", "mainline"]
  pull_request:
    branches: ["main", "mainline"]
  schedule:
    - cron: "0 8 * * MON"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  Analysis:
    name: Analysis
    runs-on: ubuntu-latest
    permissions:
      # Private repositories require workflow metadata and checkout access.
      actions: read
      contents: read
      security-events: write
    # Match the shared workflow's analysis while retaining private-repo reads.
    # Its job-level permissions currently clear these read permissions.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          queries: +security-and-quality
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
