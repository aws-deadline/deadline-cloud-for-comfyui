name: Installer CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  Native:
    name: Native installer (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            artifact: DeadlineCloudForComfyUISubmitter-windows-x64-installer.exe
          - os: MacOS
            runner: macos-15
            artifact: DeadlineCloudForComfyUISubmitter-osx-arm64-installer.app
    defaults:
      run:
        shell: bash
    env:
      IS_DEV_BUILD: "true"
      INSTALLER_PLATFORM: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Hatch
        run: python -m pip install -r requirements-development.txt

      - name: Provision hash-verified evaluation build tools
        id: tools
        env:
          INSTALLER_TOOLS: ${{ runner.temp }}/comfyui-installer-tools
        run: python scripts/provision_installer_tools.py --platform "$INSTALLER_PLATFORM" --output "$INSTALLER_TOOLS"

      - name: Build native evaluation installer
        env:
          COMFYUI_INSTALLER_PYTHON_RUNTIME: ${{ steps.tools.outputs.python-runtime }}
          INSTALL_BUILDER_PATH: ${{ steps.tools.outputs.install-builder-path }}
          INSTALLER_PAYLOAD: ${{ runner.temp }}/comfyui-installer-payload
          INSTALLER_OUTPUT: ${{ runner.temp }}/comfyui-installer-output
        run: >-
          hatch run installer:build-installer
          --install-builder-path "$INSTALL_BUILDER_PATH"
          --local-dev --payload-dir "$INSTALLER_PAYLOAD"
          --output-dir "$INSTALLER_OUTPUT"

      - name: Test native install, upgrade, and uninstall
        env:
          COMFYUI_INSTALLER_PATH: ${{ runner.temp }}/comfyui-installer-output/${{ matrix.artifact }}
        run: hatch run test-installer --basetemp "$RUNNER_TEMP/native-installer"
