specificationVersion: 'jobtemplate-2023-09'
name: ComfyUI Workflow (comfy-cli)
description: >
  Runs a ComfyUI workflow headlessly with comfy-cli. A job environment starts ComfyUI once
  per session with comfy launch, loading the models attached to the job, and the task runs
  the workflow with comfy run.

parameterDefinitions:

# Workflow Parameters
- name: WorkflowFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Workflow File
    groupLabel: Workflow Parameters
    fileFilters:
    - label: ComfyUI workflow
      patterns: ["*.json"]
    - label: All Files
      patterns: ["*"]
  description: >
    Choose a ComfyUI workflow, either saved normally or exported with Workflow > Export (API).
    comfy-cli converts normal workflows to API format.
- name: InputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: NONE
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Input Directory
    groupLabel: Workflow Parameters
  default: ""
  description: >
    ComfyUI's input directory, which load nodes such as LoadImage read from. Only the
    files the workflow uses are attached to the job, not the whole directory, and
    ComfyUI on the worker reads them from where they're mapped. Leave empty to use an
    empty input directory in the session.
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Workflow Parameters
  default: "./output"
  description: >
    Choose the output directory. ComfyUI writes the outputs of Save nodes here.

# Model Parameters
- name: ModelDirectory
  type: PATH
  objectType: DIRECTORY
  dataFlow: NONE
  userInterface:
    control: HIDDEN
  default: ""
  description: >
    A directory of model files, laid out like ComfyUI's models folder with
    subfolders such as checkpoints, loras and vae. Only the files the workflow
    loads are attached to the job, not the whole directory. ComfyUI on the
    worker reads them from where they're mapped. Leave empty when the workers
    already have every model, for example through an extra model paths config.
- name: ExtraModelPathsConfig
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Extra Model Paths Config
    groupLabel: Model Parameters
  default: ""
  description: >
    Optional path, on the worker, to an extra_model_paths.yaml file that points
    ComfyUI at more model folders or custom_nodes folders, for example on shared
    storage. ComfyUI also searches the models attached to the job.

# Advanced Parameters
- name: ComfyUIArgs
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Extra ComfyUI Arguments
    groupLabel: Advanced Parameters
  default: ""
  description: >
    Extra command line arguments for the ComfyUI server, for example "--lowvram".
    Use quotes to group arguments that contain spaces. Shell commands, variable
    expansion and command substitution are not supported. The template's listen
    address, port and input, output and base directories take precedence.
- name: ServerStartTimeout
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Server Start Timeout (seconds)
    groupLabel: Advanced Parameters
  default: 600
  minValue: 30
  description: How long to wait for the ComfyUI server to start.
- name: WorkflowTimeout
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Workflow Timeout (seconds)
    groupLabel: Advanced Parameters
  default: 3600
  minValue: 60
  maxValue: 82800
  description: >
    How long each task can run the workflow, up to 23 hours. comfy run also waits this long for
    ComfyUI to report progress, since loading a large model can take minutes without any. Video
    workflows on smaller GPUs can need more than an hour.

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  default: comfy
  description: >
    If you have a Queue Environment that creates a Conda environment from a parameter called CondaPackages, this
    will set the default packages to use for the job. The comfy package provides ComfyUI and comfy-cli.

jobEnvironments:
- name: ComfyUIServer
  description: >
    Starts ComfyUI in the background with comfy launch, with the attached models, custom
    nodes and inputs, for the tasks in the session to share.
  variables:
    COMFY_NO_TELEMETRY: "1"
    COMFYUI_SESSION_DIR: "{{Session.WorkingDirectory}}"
    COMFYUI_MODEL_DIRECTORY: "{{Param.ModelDirectory}}"
    COMFYUI_EXTRA_MODEL_PATHS_CONFIG: "{{Param.ExtraModelPathsConfig}}"
    COMFYUI_INPUT_DIR: "{{Param.InputDir}}"
    COMFYUI_OUTPUT_DIR: "{{Param.OutputDir}}"
    COMFYUI_ARGS: "{{Param.ComfyUIArgs}}"
    COMFYUI_SERVER_START_TIMEOUT: "{{Param.ServerStartTimeout}}"
    COMFYUI_WORKFLOW_FILE: "{{Param.WorkflowFile}}"
    COMFYUI_WORKFLOW_TIMEOUT: "{{Param.WorkflowTimeout}}"
  script:
    actions:
      onEnter:
        command: bash
        args: ['{{Env.File.Enter}}']
        timeout: 7200
      onExit:
        command: bash
        args: ['{{Env.File.Exit}}']
        timeout: 120
    embeddedFiles:
    - name: Enter
      filename: enter-comfyui-server.sh
      type: TEXT
      data: |
        #!/bin/env bash
        set -euo pipefail

        diagnostics() {
            python -c 'import sys
        for line in sys.stdin:
            line = line.rstrip("\r\n").replace("\r", "\\r")
            for offset in range(0, max(1, len(line)), 4088):
                print("comfy: " + line[offset:offset + 4088], flush=True)'
        }

        MODEL_PATHS="$COMFYUI_SESSION_DIR/extra_model_paths.yaml"
        # JSON is also valid YAML. Serializing the paths preserves quotes and line breaks.
        python - <<'PY' 2>&1 | diagnostics
        import json
        import os
        import re
        from pathlib import Path

        paths = {}
        custom_nodes = os.environ.get("COMFYUI_CUSTOM_NODES_DIR", "")
        if custom_nodes and Path(custom_nodes).is_dir():
            paths["conda_custom_nodes"] = {"custom_nodes": custom_nodes}
        # Param.ModelDirectory has already had OpenJD's path mapping applied.
        model_directory = os.environ["COMFYUI_MODEL_DIRECTORY"]
        if model_directory and Path(model_directory).is_dir():
            folders = {
                folder.name: folder.name + "/"
                for folder in sorted(Path(model_directory).iterdir())
                if folder.is_dir() and re.fullmatch(r"[A-Za-z0-9_]+", folder.name)
            }
            paths["model_directory"] = {"base_path": model_directory, **folders}
        with open(Path(os.environ["COMFYUI_SESSION_DIR"]) / "extra_model_paths.yaml", "w") as f:
            if paths:
                json.dump(paths, f, indent=2)
        PY
        # ComfyUI can't read an empty extra model paths file, so it's only passed with entries.
        MODEL_PATH_FILES=()
        if [ -s "$MODEL_PATHS" ]; then
            MODEL_PATH_FILES+=("$MODEL_PATHS")
        fi
        if [ -n "$COMFYUI_EXTRA_MODEL_PATHS_CONFIG" ]; then
            MODEL_PATH_FILES+=("$COMFYUI_EXTRA_MODEL_PATHS_CONFIG")
        fi
        MODEL_PATH_ARGS=()
        if [ ${#MODEL_PATH_FILES[@]} -gt 0 ]; then
            MODEL_PATH_ARGS=(--extra-model-paths-config "${MODEL_PATH_FILES[@]}")
        fi

        # Keep ComfyUI's data out of the shared conda environment: use a base directory
        # in the session. ComfyUI 0.38.0 fails to start on one without custom_nodes/.
        BASE_DIR="$COMFYUI_SESSION_DIR/comfyui"

        # Path mapping turns InputDir into the folder where the job's input files were attached.
        INPUT_DIR="$COMFYUI_INPUT_DIR"
        if [ -z "$INPUT_DIR" ]; then
            INPUT_DIR="$BASE_DIR/input"
        fi
        COMFYUI_INPUT_DIR="$INPUT_DIR" \
            python -c 'import os; print("Input directory: " + repr(os.environ["COMFYUI_INPUT_DIR"]))' \
            2>&1 | diagnostics
        mkdir -p -- "$BASE_DIR/custom_nodes" "$COMFYUI_OUTPUT_DIR" "$INPUT_DIR" \
            2>&1 | diagnostics

        PORT=$(python -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
        echo "openjd_status: Starting ComfyUI with comfy launch"
        # Parse the extra arguments as words, then pass them directly as argv.
        COMFYUI_PORT="$PORT" COMFYUI_BASE_DIR="$BASE_DIR" COMFYUI_INPUT_DIR="$INPUT_DIR" \
            python - ${MODEL_PATH_ARGS[@]+"${MODEL_PATH_ARGS[@]}"} <<'PY'
        import os
        import shlex
        import subprocess
        import sys

        def diagnostic(text):
            for line in text.replace("\r", "\\r").split("\n"):
                for offset in range(0, max(1, len(line)), 4088):
                    print("comfy: " + line[offset:offset + 4088], flush=True)

        try:
            extra_args = shlex.split(os.environ["COMFYUI_ARGS"])
            if "--" in extra_args:
                raise ValueError("the argument terminator '--' is not supported")
        except ValueError as e:
            print(f"openjd_fail: Invalid Extra ComfyUI Arguments: {e}", flush=True)
            sys.exit(1)
        # ComfyUI's argparse parser uses the last value of repeated options, including
        # abbreviations. Put the template's required values after the extra arguments.
        process = subprocess.Popen(
            [
                "comfy", "--skip-prompt", "--workspace", os.environ["COMFYUI_LOCATION"],
                "launch", "--background", "--",
                *extra_args, *sys.argv[1:],
                "--listen", "127.0.0.1", "--port", os.environ["COMFYUI_PORT"],
                "--base-directory", os.environ["COMFYUI_BASE_DIR"],
                "--input-directory", os.environ["COMFYUI_INPUT_DIR"],
                "--output-directory", os.environ["COMFYUI_OUTPUT_DIR"],
            ],
            stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
            text=True, encoding="utf-8", errors="replace",
        )
        # Only the template emits OpenJD control lines; child output stays diagnostic.
        with process.stdout:
            for line in process.stdout:
                diagnostic(line.rstrip("\r\n"))
        sys.exit(process.wait())
        PY
        echo "openjd_env: COMFYUI_PORT=$PORT"

        for (( i = 0; i < COMFYUI_SERVER_START_TIMEOUT; i++ )); do
            if curl -sf "http://127.0.0.1:$PORT/system_stats" > /dev/null; then
                echo "ComfyUI server is ready after ${i}s"
                curl -s "http://127.0.0.1:$PORT/system_stats" 2>&1 | diagnostics
                # ComfyUI starts even when a custom node fails to import, then fails each
                # workflow that uses it, so fail here with the import error instead.
                LOG=$(comfy --skip-prompt --json --workspace "$COMFYUI_LOCATION" logs --port "$PORT" --tail 5000 2>/dev/null \
                    | python -c 'import json, sys; print("".join(json.load(sys.stdin)["data"]["lines"]))' || true)
                if grep -q "(IMPORT FAILED)" <<< "$LOG"; then
                    grep -A20 "Traceback\|Cannot import\|(IMPORT FAILED)" <<< "$LOG" \
                        | diagnostics || true
                    comfy --skip-prompt stop --port "$PORT" 2>&1 | diagnostics || true
                    echo "openjd_fail: A custom node failed to import"
                    exit 1
                fi
                exit 0
            fi
            sleep 1
        done
        echo "openjd_fail: The ComfyUI server didn't start within ${COMFYUI_SERVER_START_TIMEOUT}s"
        exit 1
    - name: Exit
      filename: exit-comfyui-server.sh
      type: TEXT
      data: |
        #!/bin/env bash
        set -uo pipefail
        diagnostics() {
            python -c 'import sys
        for line in sys.stdin:
            line = line.rstrip("\r\n").replace("\r", "\\r")
            for offset in range(0, max(1, len(line)), 4088):
                print("comfy: " + line[offset:offset + 4088], flush=True)'
        }
        # onEnter sets COMFYUI_PORT only once it starts the server.
        if [ -z "${COMFYUI_PORT:-}" ]; then
            exit 0
        fi
        comfy --skip-prompt stop --port "$COMFYUI_PORT" 2>&1 | diagnostics

steps:
- name: RunWorkflow
  script:
    actions:
      onRun:
        command: python
        args: ['{{Task.File.Run}}']
        # The task script stops the workflow after Workflow Timeout. This is a ceiling above that,
        # since a format string timeout needs an OpenJD extension.
        timeout: 86400
    embeddedFiles:
    - name: Run
      filename: run-workflow.py
      type: TEXT
      data: |
        import json
        import os
        import subprocess
        import sys
        import urllib.request

        PORT = os.environ["COMFYUI_PORT"]
        OUTPUT_DIR = os.environ["COMFYUI_OUTPUT_DIR"]
        WORKFLOW_TIMEOUT = int(os.environ["COMFYUI_WORKFLOW_TIMEOUT"])
        SERVER = ["--where", "local", "--host", "127.0.0.1", "--port", PORT]


        def diagnostic(text, *, file=sys.stdout):
            # Keep every physical log line short: OpenJD can split long lines into records.
            for line in str(text).replace("\r", "\\r").split("\n"):
                for offset in range(0, max(1, len(line)), 4088):
                    print("comfy: " + line[offset:offset + 4088], file=file, flush=True)


        def fail(message):
            # Error messages can contain paths or command output with line breaks.
            message = json.dumps(str(message), ensure_ascii=True)[1:-1]
            limit = 4096 - len("openjd_fail: ") - 1
            print("openjd_fail: " + message[:limit], flush=True)
            if len(message) > limit:
                diagnostic(message[limit:])
            sys.exit(1)


        def interrupt():
            """Stops the running prompt, so the session's next task doesn't wait behind it."""
            try:
                request = urllib.request.Request(f"http://127.0.0.1:{PORT}/interrupt", data=b"", method="POST")
                urllib.request.urlopen(request, timeout=30).close()
            except OSError as e:
                diagnostic(f"Couldn't interrupt the workflow: {e}")


        def comfy_run(*args, timeout=None):
            try:
                result = subprocess.run(
                    ["comfy", "--skip-prompt", "run", *args, *SERVER, "--json"],
                    capture_output=True, text=True, encoding="utf-8", errors="replace",
                    timeout=timeout,
                )
            except subprocess.TimeoutExpired:
                interrupt()
                fail(f"The workflow didn't finish within the Workflow Timeout of {timeout} seconds.")
            envelope = None
            # comfy-cli writes each event on one line, with non-ASCII text unescaped. Split on
            # newlines only: splitlines() also splits on characters such as U+2028, which can be
            # inside a prompt, and that breaks the line's JSON.
            for line in result.stdout.split("\n"):
                diagnostic(line)
                try:
                    event = json.loads(line)
                except ValueError:
                    continue
                if isinstance(event, dict) and event.get("type") == "envelope":
                    envelope = event
            if result.stderr:
                diagnostic(result.stderr, file=sys.stderr)
            if envelope is None:
                fail(f"comfy run printed no result (exit code {result.returncode}). See its output above.")
            if result.returncode != 0 or not envelope.get("ok"):
                error = envelope.get("error") or {}
                fail(f"comfy run failed: {error.get('code', result.returncode)} {error.get('message', '')}")
            return envelope


        # Convert the workflow to API format. comfy-cli accepts both formats, and converts
        # UI-format workflows using the running server's node definitions.
        print("openjd_status: Preparing the workflow", flush=True)
        preview = comfy_run("--workflow", os.environ["COMFYUI_WORKFLOW_FILE"], "--print-prompt")
        workflow = (preview.get("data") or {}).get("prompt")
        if not isinstance(workflow, dict) or not workflow:
            fail("comfy run --print-prompt returned no workflow")

        task_workflow = os.path.abspath("workflow_api.json")
        with open(task_workflow, "w", encoding="utf-8") as f:
            json.dump(workflow, f, indent=2)

        print("openjd_status: Running the workflow", flush=True)
        before = {os.path.join(root, name) for root, _, names in os.walk(OUTPUT_DIR) for name in names}
        # The timeout is how long comfy run waits without hearing from ComfyUI. Its default of 120
        # seconds is shorter than loading a large model can take.
        comfy_run(
            "--workflow", task_workflow, "--wait", "--timeout", str(WORKFLOW_TIMEOUT),
            timeout=WORKFLOW_TIMEOUT,
        )
        outputs = sorted(
            os.path.relpath(path, OUTPUT_DIR)
            for root, _, names in os.walk(OUTPUT_DIR) for name in names
            if (path := os.path.join(root, name)) not in before
        )
        diagnostic(f"Finished the workflow. Outputs in {OUTPUT_DIR!r}:")
        for path in outputs:
            diagnostic(f"  {path!r}")
        if not outputs:
            fail("The workflow produced no output files. Add a Save node, such as SaveImage.")
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
    amounts:
    - name: amount.worker.gpu
      min: 1
