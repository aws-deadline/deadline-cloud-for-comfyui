[envs.default]
pre-install-commands = ["pip install -r requirements-testing.txt"]

[envs.default.scripts]
sync = "pip install -r requirements-testing.txt"
test = "pytest {args:test/unit} -vvv"
test-installer = "pytest --no-cov {args:test/installer} -vvv"
typing = "mypy {args:src test}"
style = [
  "ruff check {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "style",
]
lint = [
  "style",
  "typing",
]

[envs.integ]
pre-install-commands = [
  "pip install -r requirements-testing.txt",
  "pip install -r requirements-integ-testing.txt",
  "python -m playwright install chromium"
]

[envs.integ.scripts]
sync = "pip install -r requirements-integ-testing.txt"
test = "pytest --no-cov {args:test/integ} -vvv"

[[envs.all.matrix]]
python = ["3.13", "3.14"]

# Builds the Windows and macOS installers, as in the other Deadline Cloud integrations.
[envs.installer]
# boto3 downloads InstallBuilder for release builds. click runs the build command.
dependencies = [
  "boto3 == 1.*",
  "click == 8.*",
]

[envs.installer.scripts]
build-installer = 'python "{root}/scripts/build_installer_cli.py" --installer-source-path "{root}/installer/DeadlineCloudForComfyUISubmitter.xml" {args:}'
